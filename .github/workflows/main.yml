name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  statuses: write

jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Formatting
      uses: super-linter/super-linter@v9.0.0
      env:
        VALIDATE_ALL_CODEBASE: false
        DEFAULT_BRANCH: main
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Setting any VALIDATE_* to true runs *only* those linters.
        # snakefmt reads .github/linters/.snakefmt.toml
        VALIDATE_SNAKEMAKE_SNAKEFMT: true
  linting:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Install Snakemake
      run: pip install snakemake -r requirements.txt
    - name: Linting
      # Advisory: the Snakefile has known lints (e.g. the global DATA_PATH in shell
      # commands), and snakemake --lint exits non-zero when it reports any.
      continue-on-error: true
      run: snakemake --lint
  dry-run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported major version, and the latest release
        snakemake: ["snakemake>=8,<9", "snakemake"]
    name: dry-run (${{ matrix.snakemake }})
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Install Snakemake
      run: pip install "${{ matrix.snakemake }}" -r requirements.txt
    - name: Dry run on the bundled test sample (every mode)
      run: |
        snakemake --cores 4 --dry-run
        snakemake --cores 4 --dry-run --config make-subsampled=True
        snakemake --cores 4 --dry-run --config analyze-subsampled=True
        snakemake --cores 4 --dry-run --config bam2tensor=True
