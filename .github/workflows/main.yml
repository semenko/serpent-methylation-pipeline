name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  statuses: write

jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Formatting
      uses: super-linter/super-linter@v8.3.1
      env:
        VALIDATE_ALL_CODEBASE: false
        DEFAULT_BRANCH: main
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Setting any VALIDATE_* to true runs *only* those linters.
        # snakefmt reads .github/linters/.snakefmt.toml
        VALIDATE_SNAKEMAKE_SNAKEFMT: true
  linting:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Linting
      uses: snakemake/snakemake-github-action@v2.0.1
      with:
        directory: .
        stagein: 'pip install -r requirements.txt'
        snakefile: workflow/Snakefile
        args: "--lint"
  dry-run:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Dry run on the bundled test sample
      uses: snakemake/snakemake-github-action@v2.0.1
      with:
        directory: .
        stagein: 'pip install -r requirements.txt'
        snakefile: workflow/Snakefile
        args: "--cores 4 --dry-run"
